spring.application.name=petnode-api

# Server configuration
server.port=${SERVER_PORT:8080}
server.servlet.context-path=/

# MongoDB Atlas Configuration
spring.data.mongodb.uri=${MONGODB_URI}
spring.data.mongodb.database=petnode_db
spring.data.mongodb.auto-index-creation=true

# Logging configuration
logging.level.root=INFO
logging.level.com.petnode=DEBUG

# Mail configuration
spring.mail.host=${MAIL_HOST:smtp.gmail.com}
spring.mail.port=${MAIL_PORT:587}
spring.mail.username=${MAIL_USERNAME}
spring.mail.password=${MAIL_PASSWORD}
spring.mail.properties.mail.smtp.auth=true
spring.mail.properties.mail.smtp.starttls.enable=true
spring.mail.properties.mail.smtp.starttls.required=true
spring.mail.from=${MAIL_FROM:noreply@petnode.com}


springdoc.api-docs.path=/v3/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true


jwt.secret=${JWT_SECRET:fGVSeF1ifXY6Uz97WllmTFUvX0BYIzA2T19QcnliPDA/VjBmMHsxZ11cNVZAPmQ8OV4jXypRI18vKjdANDVXMQ==}
